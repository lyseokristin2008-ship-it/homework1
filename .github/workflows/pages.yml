name: Deploy site to GitHub Pages

# Публикует папку money/ как сайт GitHub Pages.
# Ссылка после первого прогона: https://<ник>.github.io/<репозиторий>/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site files (папка money)
        uses: actions/upload-pages-artifact@v3
        with:
          path: money

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
